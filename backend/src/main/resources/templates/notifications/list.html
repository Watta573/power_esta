<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
  <h1 class="h4 mb-3">Notifications</h1>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Canal</th>
          <th>Message</th>
          <th>Lu</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="n : ${notifications}">
          <td th:text="${#temporals.format(n.dateEnvoi, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
          <td th:text="${n.type}">TYPE</td>
          <td th:text="${n.canal}">INTERNE</td>
          <td th:text="${n.message}">message</td>
          <td>
            <span class="badge" th:classappend="${n.lu} ? 'text-bg-secondary' : 'text-bg-primary'"
                  th:text="${n.lu} ? 'Oui' : 'Non'">Non</span>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(notifications)}">
          <td colspan="5" class="text-center text-muted py-3">Aucune notification.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
