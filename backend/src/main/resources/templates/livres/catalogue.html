<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Catalogue | Biblioteca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/accueil}">Biblioteca</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Connexion</a>
      <a class="btn btn-light btn-sm" th:href="@{/profil}">Profil</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h4 mb-0">Catalogue des livres</h1>
  </div>

  <form class="row g-2 mb-3" method="get" th:action="@{/livres}">
    <div class="col-12 col-md-5">
      <input class="form-control" type="text" name="q" placeholder="Rechercher (titre, auteur, ISBN, mots-clés)"
             th:value="${q}"/>
    </div>
    <div class="col-12 col-md-3">
      <select class="form-select" name="categorieId">
        <option value="" th:selected="${categorieId == null}">Toutes catégories</option>
        <option th:each="c: ${categories}" th:value="${c.id}" th:text="${c.nom}" th:selected="${categorieId == c.id}">
          Informatique
        </option>
      </select>
    </div>
    <div class="col-12 col-md-2">
      <input class="form-control" type="text" name="langue" placeholder="Langue (ex: Francais)"
             th:value="${langue}"/>
    </div>
    <div class="col-12 col-md-2">
      <select class="form-select" name="dispo">
        <option value="" th:selected="${dispo == null}">Dispo: tout</option>
        <option value="true" th:selected="${dispo != null && dispo}">Disponible</option>
        <option value="false" th:selected="${dispo != null && !dispo}">Indisponible</option>
      </select>
    </div>
    <div class="col-12 col-md-2 d-grid">
      <button class="btn btn-primary" type="submit">OK</button>
    </div>
  </form>

  <div class="row g-3">
    <div class="col-12 col-md-6 col-lg-4" th:each="l : ${page.content}">
      <div class="card shadow-sm h-100">
        <div class="ratio ratio-4x3 bg-white" th:if="${l.couverture != null}">
          <img th:src="${l.couverture}" class="object-fit-contain" alt="couverture"/>
        </div>
        <div class="card-body">
          <div class="fw-semibold" th:text="${l.titre}">Titre</div>
          <div class="text-muted small" th:text="${l.auteur}">Auteur</div>
          <div class="text-muted small" th:text="${l.isbn}">ISBN</div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
          <span class="badge text-bg-secondary" th:text="${l.categorie.nom}">Cat</span>
          <a class="btn btn-sm btn-outline-primary" th:href="@{'/livres/' + ${l.id}}">Détails</a>
        </div>
      </div>
    </div>
    <div class="col-12" th:if="${#lists.isEmpty(page.content)}">
      <div class="alert alert-secondary mb-0">Aucun résultat.</div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3">
    <div class="text-muted small" th:text="'Page ' + (${page.number}+1) + ' / ' + ${page.totalPages}">Page</div>
    <div class="btn-group">
      <a class="btn btn-outline-secondary btn-sm"
         th:classappend="${page.first} ? 'disabled'"
         th:href="@{/livres(page=${page.number - 1}, size=${page.size}, q=${q}, categorieId=${categorieId}, langue=${langue}, dispo=${dispo})}">
        Prev
      </a>
      <a class="btn btn-outline-secondary btn-sm"
         th:classappend="${page.last} ? 'disabled'"
         th:href="@{/livres(page=${page.number + 1}, size=${page.size}, q=${q}, categorieId=${categorieId}, langue=${langue}, dispo=${dispo})}">
        Next
      </a>
    </div>
  </div>
</main>
</body>
</html>
