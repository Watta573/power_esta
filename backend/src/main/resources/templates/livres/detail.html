<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Détail livre | Biblioteca</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/livres}">Biblioteca</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{/profil}">Profil</a>
      <a class="btn btn-light btn-sm" th:href="@{/logout}">Déconnexion</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <a class="btn btn-outline-secondary btn-sm mb-3" th:href="@{/livres}">← Retour</a>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-12 col-lg-4" th:if="${livre.couverture != null}">
          <div class="ratio ratio-4x3 bg-white">
            <img th:src="${livre.couverture}" class="object-fit-contain" alt="couverture"/>
          </div>
        </div>
        <div class="col">
          <h1 class="h4 mb-1" th:text="${livre.titre}">Titre</h1>
          <div class="text-muted" th:text="${livre.auteur}">Auteur</div>
          <div class="small text-muted" th:text="'ISBN: ' + ${livre.isbn}">ISBN</div>
          <div class="small text-muted" th:text="'Catégorie: ' + ${livre.categorie.nom}">Cat</div>
          <div class="small text-muted" th:if="${livre.langue != null}" th:text="'Langue: ' + ${livre.langue}">FR</div>
          <div class="small text-muted" th:if="${livre.anneePublication != null}" th:text="'Année: ' + ${livre.anneePublication}">2024</div>

          <hr/>
          <p class="mb-0" th:if="${livre.description != null}" th:text="${livre.description}">Description</p>
          <p class="text-muted mb-0" th:if="${livre.description == null}">Pas de description.</p>
        </div>
      </div>
    </div>
    <div class="card-footer bg-white d-flex justify-content-between align-items-center">
      <span class="badge" th:classappend="${nbDispo > 0} ? 'text-bg-success' : 'text-bg-secondary'"
            th:text="${nbDispo > 0} ? (${nbDispo} + ' dispo') : 'Indisponible'">Dispo</span>
      <span class="text-muted small" th:text="'Exemplaires: ' + ${#lists.size(exemplaires)}">0</span>
    </div>
  </div>
</main>
</body>
</html>
