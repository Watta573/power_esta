<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/accueil}">Biblioteca</a>
    <a class="btn btn-light btn-sm" th:href="@{/logout}">Déconnexion</a>
  </div>
</nav>

<main class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-white"><strong>Profil utilisateur</strong></div>
    <div class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-3">Identifiant</dt>
        <dd class="col-sm-9" th:text="${username}">user</dd>
        <dt class="col-sm-3">Rôles</dt>
        <dd class="col-sm-9" th:text="${roles}">ADMIN</dd>
      </dl>
    </div>
  </div>
</main>
</body>
</html>
