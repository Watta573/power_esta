<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/dashboard}">Biblioteca Dashboard</a>
    <a class="btn btn-light btn-sm" th:href="@{/logout}">Déconnexion</a>
  </div>
</nav>

<main class="container py-4">
  <div class="row g-3 mb-3">
    <div class="col-12 col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="text-muted small">Total livres</div>
          <div class="display-6 fw-bold" th:text="${totalLivres}">0</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="text-muted small">Emprunts en cours</div>
          <div class="display-6 fw-bold" th:text="${empruntsEnCours}">0</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="text-muted small">Retards</div>
          <div class="display-6 fw-bold text-danger" th:text="${retards}">0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-white"><strong>Emprunts par jour (30 jours)</strong></div>
        <div class="card-body">
          <canvas id="lineChart" height="100"></canvas>
        </div>
      </div>
    </div>
    <div class="col-12 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-header bg-white"><strong>Répartition catégories</strong></div>
        <div class="card-body">
          <canvas id="pieChart" height="220"></canvas>
        </div>
      </div>
    </div>
  </div>
</main>

<script th:inline="javascript">
  const joursLabels = /*[[${joursLabels}]]*/ [];
  const joursValues = /*[[${joursValues}]]*/ [];
  const catLabels = /*[[${catLabels}]]*/ [];
  const catValues = /*[[${catValues}]]*/ [];

  new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
      labels: joursLabels,
      datasets: [{
        label: 'Emprunts',
        data: joursValues,
        borderColor: '#0d6efd',
        backgroundColor: 'rgba(13,110,253,0.15)',
        tension: 0.25,
        fill: true
      }]
    },
    options: {responsive: true, maintainAspectRatio: false}
  });

  new Chart(document.getElementById('pieChart'), {
    type: 'pie',
    data: {
      labels: catLabels,
      datasets: [{
        data: catValues,
        backgroundColor: ['#0d6efd', '#198754', '#fd7e14', '#dc3545', '#6f42c1', '#20c997']
      }]
    },
    options: {responsive: true, maintainAspectRatio: false}
  });
</script>
</body>
</html>
