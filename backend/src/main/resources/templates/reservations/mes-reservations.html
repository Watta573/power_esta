<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes réservations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
  <div th:if="${success}" class="alert alert-success" th:text="${success}">Succès</div>
  <h1 class="h4 mb-3">Mes réservations</h1>

  <div class="card shadow-sm mb-3">
    <div class="card-header bg-white"><strong>Nouvelle réservation</strong></div>
    <div class="card-body">
      <form th:action="@{/reservations}" method="post" class="row g-2">
        <div class="col-12 col-md-5">
          <label class="form-label">ID Utilisateur</label>
          <input class="form-control" type="number" name="utilisateurId" th:value="${param.utilisateurId}" required>
        </div>
        <div class="col-12 col-md-5">
          <label class="form-label">ID Livre</label>
          <input class="form-control" type="number" name="livreId" required>
        </div>
        <div class="col-12 col-md-2 d-grid align-items-end">
          <button class="btn btn-primary mt-4" type="submit">Réserver</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Livre</th>
          <th>Statut</th>
          <th>Position</th>
          <th>Expire le</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reservations}">
          <td th:text="${r.id}">1</td>
          <td th:text="${r.livre.titre}">Titre</td>
          <td th:text="${r.statut}">EN_ATTENTE</td>
          <td th:text="${r.position}">1</td>
          <td th:text="${r.dateExpiration}">2026-01-01</td>
          <td class="text-end">
            <form th:if="${r.statut.name() == 'EN_ATTENTE' || r.statut.name() == 'DISPONIBLE'}"
                  th:action="@{'/reservations/' + ${r.id}}" method="post" class="d-inline">
              <input type="hidden" name="_method" value="delete"/>
              <input type="hidden" name="utilisateurId" th:value="${param.utilisateurId}"/>
              <button class="btn btn-sm btn-outline-danger" type="submit">Annuler</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reservations)}">
          <td colspan="6" class="text-center text-muted py-3">Aucune réservation.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
