<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Historique mouvements | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/admin/livres}">Biblioteca</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{'/admin/livres/' + ${livre.id}}">Retour</a>
      <a class="btn btn-light btn-sm" th:href="@{/logout}">Déconnexion</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h1 class="h4 mb-0">Historique</h1>
      <div class="text-muted small" th:text="${livre.titre}">Livre</div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Exemplaire</th>
          <th>Notes</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${mouvements}">
          <td th:text="${#temporals.format(m.dateHeure, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
          <td th:text="${m.type}">EMPRUNT</td>
          <td th:text="${m.exemplaire.codeExemplaire}">EXP-...</td>
          <td th:text="${m.notes}">...</td>
        </tr>
        <tr th:if="${#lists.isEmpty(mouvements)}">
          <td colspan="4" class="text-center text-muted py-3">Aucun mouvement.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
