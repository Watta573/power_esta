<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Livres | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/dashboard}">Biblioteca</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{/admin/livres/nouveau}">Nouveau</a>
      <a class="btn btn-light btn-sm" th:href="@{/logout}">Déconnexion</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>

  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h4 mb-0">Livres</h1>
  </div>

  <form class="row g-2 mb-3" method="get" th:action="@{/admin/livres}">
    <div class="col-12 col-md-6">
      <input class="form-control" type="text" name="q" placeholder="Rechercher" th:value="${q}"/>
    </div>
    <div class="col-12 col-md-4">
      <select class="form-select" name="categorieId">
        <option value="" th:selected="${categorieId == null}">Toutes catégories</option>
        <option th:each="c: ${categories}" th:value="${c.id}" th:text="${c.nom}" th:selected="${categorieId == c.id}">
          Informatique
        </option>
      </select>
    </div>
    <div class="col-12 col-md-2 d-grid">
      <button class="btn btn-primary" type="submit">OK</button>
    </div>
  </form>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead>
        <tr>
          <th>Titre</th>
          <th>Auteur</th>
          <th>ISBN</th>
          <th>Catégorie</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${page.content}">
          <td th:text="${l.titre}">Titre</td>
          <td th:text="${l.auteur}">Auteur</td>
          <td th:text="${l.isbn}">ISBN</td>
          <td th:text="${l.categorie.nom}">Cat</td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary" th:href="@{'/admin/livres/' + ${l.id}}">Ouvrir</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(page.content)}">
          <td colspan="5" class="text-center text-muted py-3">Aucun livre.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3">
    <div class="text-muted small" th:text="'Page ' + (${page.number}+1) + ' / ' + ${page.totalPages}">Page</div>
    <div class="btn-group">
      <a class="btn btn-outline-secondary btn-sm"
         th:classappend="${page.first} ? 'disabled'"
         th:href="@{/admin/livres(page=${page.number - 1}, size=${page.size}, q=${q}, categorieId=${categorieId})}">
        Prev
      </a>
      <a class="btn btn-outline-secondary btn-sm"
         th:classappend="${page.last} ? 'disabled'"
         th:href="@{/admin/livres(page=${page.number + 1}, size=${page.size}, q=${q}, categorieId=${categorieId})}">
        Next
      </a>
    </div>
  </div>
</main>
</body>
</html>
