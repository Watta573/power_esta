<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Détail livre | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/admin/livres}">Biblioteca</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{/admin/livres}">Liste</a>
      <a class="btn btn-light btn-sm" th:href="@{/logout}">Déconnexion</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>

  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h1 class="h4 mb-0" th:text="${livre.titre}">Livre</h1>
      <div class="text-muted small" th:text="${livre.isbn + ' • ' + livre.auteur}">ISBN</div>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-secondary" th:href="@{'/admin/livres/' + ${livre.id} + '/historique'}">Historique</a>
      <a class="btn btn-outline-primary" th:href="@{'/livres/' + ${livre.id}}" target="_blank">Voir public</a>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-white"><strong>Modifier</strong></div>
        <div class="card-body">
          <form th:action="@{'/admin/livres/' + ${livre.id}}" th:object="${form}" method="post" enctype="multipart/form-data" class="row g-3">
            <input type="hidden" name="_method" value="put"/>

            <div class="col-12">
              <label class="form-label">Titre</label>
              <input class="form-control" th:field="*{titre}" required/>
              <div class="text-danger small" th:errors="*{titre}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label">ISBN</label>
              <input class="form-control" th:field="*{isbn}" required/>
              <div class="text-danger small" th:errors="*{isbn}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Auteur</label>
              <input class="form-control" th:field="*{auteur}" required/>
              <div class="text-danger small" th:errors="*{auteur}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Éditeur</label>
              <input class="form-control" th:field="*{editeur}"/>
            </div>
            <div class="col-md-3">
              <label class="form-label">Édition</label>
              <input class="form-control" th:field="*{edition}"/>
            </div>
            <div class="col-md-3">
              <label class="form-label">Année</label>
              <input class="form-control" type="number" th:field="*{anneePublication}"/>
            </div>
            <div class="col-md-6">
              <label class="form-label">Catégorie</label>
              <select class="form-select" th:field="*{categorieId}">
                <option th:each="c: ${categories}" th:value="${c.id}" th:text="${c.nom}">Cat</option>
              </select>
              <div class="text-danger small" th:errors="*{categorieId}"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Langue</label>
              <input class="form-control" th:field="*{langue}"/>
            </div>
            <div class="col-12">
              <label class="form-label">Description</label>
              <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Changer couverture</label>
              <input class="form-control" type="file" name="couverture" accept="image/*"/>
              <div class="form-text" th:if="${livre.couverture != null}">
                Actuelle: <a th:href="${livre.couverture}" th:text="${livre.couverture}" target="_blank">couverture</a>
              </div>
            </div>
            <div class="col-12">
              <button class="btn btn-primary" type="submit">Enregistrer</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-white d-flex align-items-center justify-content-between">
          <strong>Exemplaires</strong>
          <span class="text-muted small" th:text="${#lists.size(exemplaires)} + ' total'">0</span>
        </div>
        <div class="card-body">
          <form th:action="@{'/admin/livres/' + ${livre.id} + '/exemplaires'}" th:object="${exemplaireForm}" method="post" class="row g-2 mb-3">
            <div class="col-md-5">
              <input class="form-control" placeholder="Code exemplaire" th:field="*{codeExemplaire}" required/>
              <div class="text-danger small" th:errors="*{codeExemplaire}"></div>
            </div>
            <div class="col-md-3">
              <select class="form-select" th:field="*{etat}">
                <option th:each="e : ${etatValues}" th:value="${e}" th:text="${e}">BON</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="form-select" th:field="*{disponible}">
                <option value="true">Dispo</option>
                <option value="false">Indispo</option>
              </select>
            </div>
            <div class="col-md-2 d-grid">
              <button class="btn btn-outline-primary" type="submit">Ajouter</button>
            </div>
            <div class="col-12">
              <input class="form-control" placeholder="Localisation (ex: A1-R2)" th:field="*{localisation}"/>
            </div>
          </form>

          <div class="table-responsive">
            <table class="table table-striped mb-0">
              <thead>
              <tr>
                <th>Code</th>
                <th>État</th>
                <th>Dispo</th>
                <th>Localisation</th>
                <th></th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="ex: ${exemplaires}">
                <td th:text="${ex.codeExemplaire}">EXP</td>
                <td>
                  <form th:action="@{'/admin/exemplaires/' + ${ex.id}}" method="post" class="d-flex gap-2 align-items-center">
                    <input type="hidden" name="_method" value="put"/>
                    <input type="hidden" name="livreId" th:value="${livre.id}"/>
                    <select class="form-select form-select-sm" name="etat" style="max-width: 140px">
                      <option th:each="e : ${etatValues}" th:value="${e}" th:text="${e}" th:selected="${ex.etat == e}">BON</option>
                    </select>
                    <select class="form-select form-select-sm" name="disponible" style="max-width: 120px">
                      <option value="true" th:selected="${ex.disponible}">Dispo</option>
                      <option value="false" th:selected="${!ex.disponible}">Indispo</option>
                    </select>
                    <button class="btn btn-sm btn-outline-secondary" type="submit">OK</button>
                  </form>
                </td>
                <td>
                  <span class="badge" th:classappend="${ex.disponible} ? 'text-bg-success' : 'text-bg-secondary'"
                        th:text="${ex.disponible} ? 'Oui' : 'Non'">Oui</span>
                </td>
                <td th:text="${ex.localisation}">A1</td>
                <td class="text-end text-muted small" th:text="${'#' + ex.id}">#1</td>
              </tr>
              <tr th:if="${#lists.isEmpty(exemplaires)}">
                <td colspan="5" class="text-center text-muted py-3">Aucun exemplaire.</td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
