<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Catégories | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/dashboard}">Biblioteca</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{/admin/categories/nouveau}">Nouveau</a>
      <a class="btn btn-light btn-sm" th:href="@{/logout}">Déconnexion</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>

  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h4 mb-0">Catégories</h1>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead>
        <tr>
          <th>Nom</th>
          <th>Description</th>
          <th>Couleur</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${page.content}">
          <td th:text="${c.nom}">Informatique</td>
          <td class="text-muted" th:text="${c.description}">...</td>
          <td>
            <span class="badge" th:style="'background:' + ${c.couleur}" th:text="${c.couleur}">#0d6efd</span>
          </td>
          <td class="text-end">
            <a class="btn btn-sm btn-outline-primary" th:href="@{'/admin/categories/' + ${c.id}}">Ouvrir</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(page.content)}">
          <td colspan="4" class="text-center text-muted py-3">Aucune catégorie.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
