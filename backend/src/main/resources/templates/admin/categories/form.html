<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Nouvelle catégorie | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/admin/categories}">Biblioteca</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{/admin/categories}">Retour</a>
      <a class="btn btn-light btn-sm" th:href="@{/logout}">Déconnexion</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-white"><strong>Créer une catégorie</strong></div>
    <div class="card-body">
      <form th:action="@{/admin/categories}" th:object="${form}" method="post" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nom</label>
          <input class="form-control" th:field="*{nom}" required/>
          <div class="text-danger small" th:errors="*{nom}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Couleur (hex)</label>
          <input class="form-control" th:field="*{couleur}" placeholder="#0d6efd"/>
          <div class="text-danger small" th:errors="*{couleur}"></div>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Enregistrer</button>
          <a class="btn btn-outline-secondary" th:href="@{/admin/categories}">Annuler</a>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>
