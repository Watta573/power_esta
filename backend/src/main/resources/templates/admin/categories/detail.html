<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Détail catégorie | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/admin/categories}">Biblioteca</a>
    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-light btn-sm" th:href="@{/admin/categories}">Liste</a>
      <a class="btn btn-light btn-sm" th:href="@{/logout}">Déconnexion</a>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div th:if="${success}" class="alert alert-success" th:text="${success}">OK</div>

  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h1 class="h4 mb-0" th:text="${cat.nom}">Cat</h1>
      <div class="text-muted small" th:text="${cat.couleur}">#0d6efd</div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-header bg-white"><strong>Modifier</strong></div>
    <div class="card-body">
      <form th:action="@{'/admin/categories/' + ${cat.id}}" th:object="${form}" method="post" class="row g-3">
        <input type="hidden" name="_method" value="put"/>
        <div class="col-md-6">
          <label class="form-label">Nom</label>
          <input class="form-control" th:field="*{nom}" required/>
          <div class="text-danger small" th:errors="*{nom}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Couleur</label>
          <input class="form-control" th:field="*{couleur}"/>
          <div class="text-danger small" th:errors="*{couleur}"></div>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>
