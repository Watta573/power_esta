<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 text-center mb-3">Connexion Biblioteca</h1>
          <div th:if="${param.error}" class="alert alert-danger py-2">Identifiants invalides.</div>
          <div th:if="${param.logout}" class="alert alert-success py-2">Déconnexion réussie.</div>
          <form th:action="@{/login}" method="post" class="vstack gap-3">
            <div>
              <label class="form-label">Utilisateur</label>
              <input class="form-control" type="text" name="username" required>
            </div>
            <div>
              <label class="form-label">Mot de passe</label>
              <input class="form-control" type="password" name="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Se connecter</button>
          </form>
          <hr>
          <div class="small text-muted">
            Comptes test: admin / biblio / etu / enseignant / public<br>
            Mot de passe: <strong>Password123</strong>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
