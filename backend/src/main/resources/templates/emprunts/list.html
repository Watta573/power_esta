<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emprunts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/dashboard}">Biblioteca</a>
    <a class="btn btn-light btn-sm" th:href="@{/logout}">Déconnexion</a>
  </div>
</nav>

<main class="container py-4">
  <div th:if="${success}" class="alert alert-success" th:text="${success}">Succès</div>
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h4 mb-0">Emprunts en retard</h1>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/emprunts/en-retard}">Voir retards</a>
  </div>

  <div class="card shadow-sm mb-3">
    <div class="card-header bg-white"><strong>Créer un emprunt</strong></div>
    <div class="card-body">
      <form th:action="@{/emprunts/nouveau}" method="post" class="row g-2">
        <div class="col-12 col-md-5">
          <label class="form-label">ID Utilisateur</label>
          <input class="form-control" type="number" name="utilisateurId" required>
        </div>
        <div class="col-12 col-md-5">
          <label class="form-label">ID Exemplaire</label>
          <input class="form-control" type="number" name="exemplaireId" required>
        </div>
        <div class="col-12 col-md-2 d-grid align-items-end">
          <button class="btn btn-primary mt-4" type="submit">Créer</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Utilisateur</th>
          <th>Exemplaire</th>
          <th>Retour prévu</th>
          <th>Statut</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${emprunts}">
          <td th:text="${e.id}">1</td>
          <td th:text="${e.utilisateur.email}">mail</td>
          <td th:text="${e.exemplaire.codeExemplaire}">EXP</td>
          <td th:text="${e.dateRetourPrevue}">2026-01-01</td>
          <td><span class="badge text-bg-danger" th:text="${e.statut}">EN_RETARD</span></td>
          <td class="text-end">
            <form th:action="@{'/emprunts/' + ${e.id} + '/retour'}" method="post" class="d-inline">
              <input type="hidden" name="_method" value="put"/>
              <button class="btn btn-sm btn-outline-success" type="submit">Retour</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(emprunts)}">
          <td colspan="6" class="text-center text-muted py-3">Aucun emprunt en retard.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
