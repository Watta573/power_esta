<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h4 mb-0">Liste des retards</h1>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/emprunts}">Retour emprunts</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-striped mb-0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Utilisateur</th>
          <th>Date retour prévue</th>
          <th>Amende (FCFA)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${emprunts}">
          <td th:text="${e.id}">1</td>
          <td th:text="${e.utilisateur.email}">mail</td>
          <td th:text="${e.dateRetourPrevue}">2026-01-01</td>
          <td th:text="${e.amende}">0</td>
        </tr>
        <tr th:if="${#lists.isEmpty(emprunts)}">
          <td colspan="4" class="text-center text-muted py-3">Aucun retard.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>
