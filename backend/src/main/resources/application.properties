spring.application.name=biblioteca

# =========================
# Database (PostgreSQL)
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/power_esta}
spring.datasource.username=${DB_USERNAME:watta}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true
logging.level.com.biblioteca=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Flyway
spring.flyway.enabled=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true
# spring.flyway.repair-on-migrate=true
# spring.flyway.out-of-order=true

# =========================
# Security / JWT
# =========================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:biblioteca}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:240}
app.security.jwt.refresh-expiration-days=${JWT_REFRESH_DAYS:7}

# Frontend URL (pour les liens dans les emails)
app.frontend.url=http://localhost:5173

# =========================
# Business configuration
# =========================
bibliotheque.amende.tarif-journalier=100
bibliotheque.emprunt.duree-etudiant=14
bibliotheque.emprunt.duree-enseignant=21
bibliotheque.emprunt.duree-public=7
bibliotheque.emprunt.quota-etudiant=3
bibliotheque.emprunt.quota-enseignant=5
bibliotheque.emprunt.quota-public=1
bibliotheque.reservation.duree-validite=3

# =========================
# File upload
# =========================
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# Mail (Gmail SMTP)
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_USERNAME}
app.mail.from-name=Biblioth\u00e8que ESTA

# =========================
# CinetPay
# =========================
cinetpay.api-key=${CINETPAY_API_KEY}
cinetpay.site-id=${CINETPAY_SITE_ID}
cinetpay.base-url=https://api.cinetpay.net
cinetpay.timeout-ms=10000
cinetpay.max-retries=3
cinetpay.webhook.ip-whitelist-enabled=${CINETPAY_IP_WHITELIST:true}
app.backend.url=${BACKEND_URL:http://localhost:8080}

# =========================
# Thymeleaf
# =========================
spring.thymeleaf.cache=false

server.port=8080

# =========================
# Frontend (React/Tauri) API
# =========================
app.frontend.cors-origins=http://localhost:5173,http://localhost:1420,tauri://localhost

